##### hostapd configuration file ##############################################

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
country_code=CN
ssid=SG2000_EVB
channel=6
hw_mode=g
ieee80211n=1
ht_capab=[SHORT-GI-20][SHORT-GI-40][HT40+]
wme_enabled=1
beacon_int=100
max_num_sta=8

# Security: WPA2-PSK; set wpa=3 only if driver/firmware supports SAE
wpa=2
wpa_passphrase=012345678
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
wpa_group_rekey=86400

# Rates for 2.4G; adjust if needed
supported_rates=10 20 55 110 60 90 120 180 240 360 480 540
basic_rates=10 20 55 110
